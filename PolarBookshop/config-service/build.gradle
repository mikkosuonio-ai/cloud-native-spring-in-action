plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
}

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

description = 'Provides functionality for centralizing the application configuration.'

repositories {
	mavenCentral()
}

ext {
	set('otelVersion', "2.33.1")
	set('springCloudVersion', "2025.1.4")
}

configurations {
	otelAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-config-server'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${otelVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	// Gradle 9 no longer puts a JUnit Platform launcher on the test runtime classpath.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

springBoot {
	buildInfo()
}

// The OpenTelemetry agent goes into the jar's root under a fixed name, outside the application's
// classpath, so that the -javaagent paths of the deployments don't change with its version.
tasks.named('bootJar') {
	from(configurations.otelAgent) {
		rename { 'opentelemetry-javaagent.jar' }
	}
}

bootBuildImage {
	// A version, not latest: on 2026-10-23 latest became an arm64-only image, which can't build on amd64.
	builder = "docker.io/paketobuildpacks/builder-noble-java-tiny:0.0.211"
	imageName = "${project.name}"
	environment = ["BP_JVM_VERSION": "25"]

	docker {
		publishRegistry {
			username = project.findProperty("registryUsername")
			password = project.findProperty("registryToken")
			url = project.findProperty("registryUrl")
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}
