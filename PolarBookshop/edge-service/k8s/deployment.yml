apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
  labels:
    app: edge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-service
  template:
    metadata:
      labels:
        app: edge-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9000"
    spec:
      containers:
        - name: edge-service
          image: edge-service
          imagePullPolicy: IfNotPresent
          lifecycle:
            # Gives the Service time to take the pod out of its endpoints before the app stops. The
            # sleep action needs no shell, which images from the tiny builders don't have.
            preStop:
              sleep:
                seconds: 5
          ports:
            - containerPort: 9000
          env:
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service
            - name: ORDER_SERVICE_URL
              value: http://order-service
            - name: SPA_URL
              value: http://polar-ui
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            timeoutSeconds: 3
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: edge-config-volume
              mountPath: /workspace/config
      volumes:
        - name: edge-config-volume
          configMap:
            name: edge-config
