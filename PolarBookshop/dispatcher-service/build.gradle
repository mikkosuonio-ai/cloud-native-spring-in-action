plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
}

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

description = 'Provides functionality for dispatching orders.'

repositories {
	mavenCentral()
}

ext {
	set('otelVersion', "2.33.1")
	set('springCloudVersion', "2025.1.4")
}

configurations {
	otelAgent
}

dependencies {
	//implementation 'org.springframework.boot:spring-boot-starter'
	//implementation 'org.springframework.cloud:spring-cloud-function-context'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-stream-binder-rabbit'
	implementation 'org.springframework.retry:spring-retry'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${otelVersion}"

	// Only on Apple Silicon. Why it's necessary: https://github.com/netty/netty/issues/11020
	// runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.101.Final:osx-aarch_64'

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
	// Gradle 9 no longer puts a JUnit Platform launcher on the test runtime classpath.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

springBoot {
	buildInfo()
}

// The OpenTelemetry agent goes into the jar's root under a fixed name, outside the application's
// classpath, so that the -javaagent paths of the deployments don't change with its version.
tasks.named('bootJar') {
	from(configurations.otelAgent) {
		rename { 'opentelemetry-javaagent.jar' }
	}
}

bootBuildImage {
	builder = "docker.io/paketobuildpacks/builder-jammy-base"
	imageName = "${project.name}"
	// Netty 4.2 (Boot 4) outgrows the 10M of direct memory the buildpack's memory calculator gives
	// it, as edge-service's responses showed. An explicit limit in JAVA_TOOL_OPTIONS takes
	// precedence, and the heap gets the rest.
	environment = ["BP_JVM_VERSION": "17",
			"BPE_DELIM_JAVA_TOOL_OPTIONS": " ",
			"BPE_APPEND_JAVA_TOOL_OPTIONS": "-XX:MaxDirectMemorySize=64M"]

	docker {
		publishRegistry {
			username = project.findProperty("registryUsername")
			password = project.findProperty("registryToken")
			url = project.findProperty("registryUrl")
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}
