stream_over_http_enabled: true

# No anonymous usage reports to Grafana Labs (finding 12).
usage_report:
  reporting_enabled: false

server:
  http_listen_port: 3100
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        # On every interface: since Tempo 2.7 the receivers listen on localhost by default.
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

# Span metrics and the service graph, written to Prometheus (with exemplars).
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both
