apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polar-ingress
  # No tls section: edge-service, and so the session cookie and the SPA, are served over plain
  # HTTP. TLS here (and for Keycloak) is part of finding 42 (44) in development/findings.md.
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* "^/actuator" {
        deny all;
        return 403;
      }
