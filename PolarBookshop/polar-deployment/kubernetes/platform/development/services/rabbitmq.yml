apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    db: polar-rabbitmq
data:
  rabbitmq.conf: |
    default_user = user
    default_pass = password
    # A relative watermark is relative to the node's memory, not to the container's limit, so the
    # kernel would OOM-kill RabbitMQ before its memory alarm could block the publishers.
    vm_memory_high_watermark.absolute = 200MiB

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-rabbitmq
  labels:
    db: polar-rabbitmq
spec:
  selector:
    matchLabels:
      db: polar-rabbitmq
  template:
    metadata:
      labels:
        db: polar-rabbitmq
    spec:
      containers:
        - name: polar-rabbitmq
          image: rabbitmq:3.13-management
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              # RabbitMQ idles at about 150 MiB, and a rabbitmqctl call peaks at about 250 MiB.
              memory: 300Mi
          # The kernel accepts TCP connections even for a hung broker, but the management
          # plugin's web server stops answering.
          startupProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: 15672
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
          # Only rabbitmq.conf, so that the image's conf.d, which logs to the console, and its
          # enabled_plugins stay.
          volumeMounts:
            - mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              name: rabbitmq-config-volume
      volumes:
        - name: rabbitmq-config-volume
          configMap:
            name: rabbitmq-config

---

apiVersion: v1
kind: Service
metadata:
  name: polar-rabbitmq
  labels:
    db: polar-rabbitmq
spec:
  type: ClusterIP
  selector:
    db: polar-rabbitmq
  ports:
  - name: amqp
    protocol: TCP
    port: 5672
    targetPort: 5672
  - name: management
    protocol: TCP
    port: 15672
    targetPort: 15672
