plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
	id 'org.graalvm.buildtools.native' version '1.1.14'
}

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

description = 'Provides quotes from the books in the library.'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('bootBuildImage') {
	builder = 'docker.io/paketobuildpacks/builder-jammy-tiny'
	// The JVM options matter only to a JVM image, such as the smoke tests build: Netty 4.2 (Boot 4)
	// outgrows the 10M of direct memory the buildpack's memory calculator gives it, as
	// edge-service's responses showed.
	environment = ['BP_NATIVE_IMAGE': 'true',
			'BPE_DELIM_JAVA_TOOL_OPTIONS': ' ',
			'BPE_APPEND_JAVA_TOOL_OPTIONS': '-XX:MaxDirectMemorySize=64M']
	imageName = "${project.name}"

	docker {
		publishRegistry {
			username = project.findProperty("registryUsername")
			password = project.findProperty("registryToken")
			url = project.findProperty("registryUrl")
		}
	}
}
