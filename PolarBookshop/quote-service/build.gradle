plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
	id 'org.graalvm.buildtools.native' version '1.1.14'
}

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

description = 'Provides quotes from the books in the library.'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
	// Gradle 9 no longer puts a JUnit Platform launcher on the test runtime classpath.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('bootBuildImage') {
	// A version, not latest: on 2026-10-23 latest became an arm64-only image, which can't build on amd64.
	builder = 'docker.io/paketobuildpacks/builder-noble-java-tiny:0.0.211'
	// The JVM options matter only to a JVM image, such as the smoke tests build: Netty 4.2 (Boot 4)
	// outgrows the 10M of direct memory the buildpack's memory calculator gives it, as
	// edge-service's responses showed.
	environment = ['BP_NATIVE_IMAGE': 'true',
			'BP_JVM_VERSION': '25',
			'BPE_DELIM_JAVA_TOOL_OPTIONS': ' ',
			'BPE_APPEND_JAVA_TOOL_OPTIONS': '-XX:MaxDirectMemorySize=64M']
	imageName = "${project.name}"

	docker {
		publishRegistry {
			username = project.findProperty("registryUsername")
			password = project.findProperty("registryToken")
			url = project.findProperty("registryUrl")
		}
	}
}
