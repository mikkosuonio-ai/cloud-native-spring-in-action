plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
	id 'org.graalvm.buildtools.native' version '1.1.14'
}

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

description = 'Provides quotes from the books in the library.'

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-function-web'

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
	// Gradle 9 no longer puts a JUnit Platform launcher on the test runtime classpath.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('bootBuildImage') {
	// A version, not latest: on 2026-10-23 latest became an arm64-only image, which can't build on amd64.
	builder = 'docker.io/paketobuildpacks/builder-noble-java-tiny:0.0.211'
	environment = ['BP_NATIVE_IMAGE': 'true', 'BP_JVM_VERSION': '25']
	imageName = "${project.name}"

	docker {
		publishRegistry {
			username = project.findProperty("registryUsername")
			password = project.findProperty("registryToken")
			url = project.findProperty("registryUrl")
		}
	}
}
