apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9002"
    spec:
      containers:
        - name: order-service
          image: order-service
          imagePullPolicy: IfNotPresent
          lifecycle:
            # Gives the Service time to take the pod out of its endpoints before the app stops. The
            # sleep action needs no shell, which images from the tiny builders don't have.
            preStop:
              sleep:
                seconds: 5
          ports:
            - containerPort: 9002
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9002
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9002
            timeoutSeconds: 3
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9002
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: order-config-volume
              mountPath: /workspace/config
      volumes:
        - name: order-config-volume
          configMap:
            name: order-config
