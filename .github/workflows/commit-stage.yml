name: Commit Stage
on:
  push:
  schedule: # Every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:

# The smoke tests make a run long, and a newer push to the same branch makes an older run
# pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-java-21:
    name: Build and Test ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          PolarBookshop/catalog-service,
        ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      # Artifact names can't contain "/". project.txt gives the summary the project's path,
      # and keeps the artifact from being empty when the build fails before the tests.
      - name: Prepare test and coverage reports
        id: reports
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p build
          echo "$PROJECT" > build/project.txt
          echo "artifact=reports-${PROJECT//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            ${{ matrix.project }}/build/project.txt
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/reports/jacoco/test/
          retention-days: 14

  build:
    name: Build and Test ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          PolarBookshop/quote-service,
          PolarBookshop/quote-function,
          PolarBookshop/dispatcher-service,
          PolarBookshop/config-service,
          PolarBookshop/order-service,
          PolarBookshop/edge-service,
        ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      # Artifact names can't contain "/". project.txt gives the summary the project's path,
      # and keeps the artifact from being empty when the build fails before the tests.
      - name: Prepare test and coverage reports
        id: reports
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p build
          echo "$PROJECT" > build/project.txt
          echo "artifact=reports-${PROJECT//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            ${{ matrix.project }}/build/project.txt
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/reports/jacoco/test/
          retention-days: 14

  k8s-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The Kubernetes release of MicroK8s 1.35/stable, which the smoke tests deploy to.
      KUBERNETES_VERSION: 1.35.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Renders the services' kustomizations with the kubectl of the runner image, and checks the
      # backing services the smoke tests deploy. The staging and production overlays in
      # polar-deployment/kubernetes/applications/ are left out: their base is the book's upstream
      # repository on GitHub, not this one.
      - name: Validate manifests
        shell: bash # runs with -o pipefail, so a kustomize error fails its pipeline
        run: |
          validate() { kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" "$@"; }
          status=0
          for dir in PolarBookshop/*/k8s; do
            echo "== $dir"
            kubectl kustomize "$dir" | validate - || status=1
          done
          dir=PolarBookshop/polar-deployment/kubernetes/platform/development/services
          echo "== $dir"
          validate "$dir" || status=1
          exit "$status"

  # Builds the images of the selected services from this commit and smoke tests them together
  # with their backing services, as on the development server. Each selection runs on its own
  # runner: together their images would fill a runner's disk, and each selection gets its own
  # row, output and logs in the summary.
  smoke-podman:
    name: Smoke test on Podman (${{ matrix.services }})
    needs: [build-java-21, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The script's service selections. It adds catalog and order for edge, and catalog for
        # order.
        services:
          - catalog order dispatcher config
          - edge
          - quote quote-function
          - order dispatcher observability
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          # Its own cache key: the image builds need other dependencies than the build jobs.
          cache-dependency-path: |
            PolarBookshop/*/build.gradle
            PolarBookshop/*/gradle/wrapper/gradle-wrapper.properties
      - name: Install podman-compose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman-compose python3-yaml
      - name: Show Podman and runner resources
        run: |
          podman version
          podman-compose version
          free -h
          df -h /
      - name: Smoke test
        shell: bash # runs with -o pipefail, so the script's status survives tee
        env:
          SERVICES: ${{ matrix.services }}
          SMOKE_JDK_17: ${{ env.JAVA_HOME_17_X64 }}
          SMOKE_JDK_21: ${{ env.JAVA_HOME_21_X64 }}
          SMOKE_JUNIT: ${{ github.workspace }}/smoke/test-results/test/TEST-smoke-podman.xml
        run: |
          read -ra services <<< "$SERVICES"
          mkdir -p smoke
          bash development/script/smoke-test.sh all "${services[@]}" --rebuild 2>&1 | tee smoke/output.txt
      # These also run when the job times out, which cancels it: a hung stack needs the logs most.
      - name: Collect the containers' state and logs
        if: ${{ !success() }}
        run: bash development/script/smoke-test.sh logs smoke/logs
      - name: Show disk use
        if: ${{ always() }}
        run: |
          df -h /
          podman system df
      # The reports job summarizes reports-* artifacts; project.txt names the row.
      - name: Prepare smoke test reports
        id: reports
        if: ${{ always() }}
        env:
          SERVICES: ${{ matrix.services }}
        run: |
          mkdir -p smoke
          echo "Smoke test on Podman: $SERVICES" > smoke/project.txt
          echo "artifact=reports-smoke-podman-${SERVICES// /-}" >> "$GITHUB_OUTPUT"
      - name: Upload smoke test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: smoke/
          retention-days: 14

  # Deploys the services' own k8s/ manifests with images built from this commit to MicroK8s on
  # the runner, as the script's --k8s mode does on the development server. --k8s supports the
  # default selection only.
  smoke-k8s:
    name: Smoke test on MicroK8s
    needs: [build-java-21, build, k8s-manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The runner's kubectl with MicroK8s' kubeconfig, set up below. Through
      # `sudo microk8s kubectl`, the script's Keycloak port-forward would run as root, and the
      # script couldn't stop it.
      KUBECTL: kubectl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          cache-dependency-path: |
            PolarBookshop/*/build.gradle
            PolarBookshop/*/gradle/wrapper/gradle-wrapper.properties
      - name: Install PyYAML
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-yaml
      # MicroK8s keeps its own copies of the images, in its registry and in containerd, and its
      # kubelet evicts pods when less than 1 GiB of disk is free. The Podman jobs leave about
      # 4.5 GB free without these copies.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Install MicroK8s
        run: |
          sudo snap install microk8s --classic --channel=1.35/stable
          sudo microk8s status --wait-ready
          # Docker on the runner sets the FORWARD policy to DROP, which can block pod traffic;
          # microk8s inspect warns about it. This job doesn't use Docker.
          sudo iptables -P FORWARD ACCEPT
          sudo microk8s enable dns registry
          sudo microk8s config | install -m 600 /dev/stdin "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Wait for the cluster DNS and registry
        run: |
          kubectl -n kube-system rollout status deployment/coredns --timeout=300s
          kubectl -n container-registry rollout status deployment/registry --timeout=300s
          curl -sSf --retry 20 --retry-delay 3 --retry-connrefused http://localhost:32000/v2/
      - name: Show tool versions and runner resources
        run: |
          podman version
          kubectl version
          free -h
          df -h /
      - name: Smoke test
        shell: bash # runs with -o pipefail, so the script's status survives tee
        env:
          SMOKE_JDK_17: ${{ env.JAVA_HOME_17_X64 }}
          SMOKE_JDK_21: ${{ env.JAVA_HOME_21_X64 }}
          SMOKE_JUNIT: ${{ github.workspace }}/smoke/test-results/test/TEST-smoke-k8s.xml
        run: |
          mkdir -p smoke
          bash development/script/smoke-test.sh all --k8s --rebuild 2>&1 | tee smoke/output.txt
      - name: Collect the namespace's state and logs
        if: ${{ !success() }}
        run: bash development/script/smoke-test.sh logs smoke/logs --k8s
      - name: Show disk use
        if: ${{ always() }}
        run: |
          df -h /
          podman system df
          # containerd's images and the registry's storage
          sudo du -sh /var/snap/microk8s/common/var/lib/containerd \
            /var/snap/microk8s/common/default-storage || true
      - name: Prepare smoke test reports
        if: ${{ always() }}
        run: |
          mkdir -p smoke
          echo "Smoke test on MicroK8s" > smoke/project.txt
      - name: Upload smoke test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-smoke-k8s
          path: smoke/
          retention-days: 14

  reports:
    name: Test and coverage reports
    needs: [build-java-21, build, smoke-podman, smoke-k8s]
    # Also after failed builds: the summary shows what failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # lists the run's artifacts for the links in the summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports
      # Without the list, the summary has no links.
      - name: List report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("reports-")) | "\(.name)\t\(.id)"' \
            > artifacts.tsv \
            || echo "::warning::Could not list the artifacts, so the summary has no links."
      - name: Summarize reports
        run: python3 .github/scripts/report-summary.py reports artifacts.tsv >> "$GITHUB_STEP_SUMMARY"

  native-build:
    name: Native Build and Test ${{ matrix.project }}
    if: false   # disabled
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          Chapter16/16-end/quote-service,
          Chapter16/16-end/quote-function,
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, unit tests and integration tests
        run: |
          cd ${{ matrix.project }}
          chmod +x gradlew
          ./gradlew nativeBuild
