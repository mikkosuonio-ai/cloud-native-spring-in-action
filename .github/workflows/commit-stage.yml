name: Commit Stage
on:
  push:
  schedule: # Every Monday
    - cron: '0 0 * * 1'

jobs:
  build-java-21:
    name: Build and Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [
          catalog-service,
        ]
    defaults:
      run:
        working-directory: PolarBookshop/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.service }}
          path: |
            PolarBookshop/${{ matrix.service }}/build/test-results/test/
            PolarBookshop/${{ matrix.service }}/build/reports/tests/test/
            PolarBookshop/${{ matrix.service }}/build/reports/jacoco/test/
          retention-days: 14

  build:
    name: Build and Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [
          quote-service,
          quote-function,
          dispatcher-service,
          config-service,
          order-service,
          edge-service,
        ]
    defaults:
      run:
        working-directory: PolarBookshop/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.service }}
          path: |
            PolarBookshop/${{ matrix.service }}/build/test-results/test/
            PolarBookshop/${{ matrix.service }}/build/reports/tests/test/
            PolarBookshop/${{ matrix.service }}/build/reports/jacoco/test/
          retention-days: 14

  reports:
    name: Test and coverage reports
    needs: [build-java-21, build]
    # Also after failed builds: the summary shows what failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports
      - name: Summarize reports
        run: python3 .github/scripts/report-summary.py reports PolarBookshop >> "$GITHUB_STEP_SUMMARY"

  native-build:
    name: Native Build and Test ${{ matrix.project }}
    if: false   # disabled
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          Chapter16/16-end/quote-service,
          Chapter16/16-end/quote-function,
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, unit tests and integration tests
        run: |
          cd ${{ matrix.project }}
          chmod +x gradlew
          ./gradlew nativeBuild
