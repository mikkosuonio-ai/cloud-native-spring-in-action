name: Commit Stage
on:
  push:
  schedule: # Every Monday
    - cron: '0 0 * * 1'

jobs:
  build-java-21:
    name: Build and Test ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          PolarBookshop/catalog-service,
        ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      # Artifact names can't contain "/". project.txt gives the summary the project's path,
      # and keeps the artifact from being empty when the build fails before the tests.
      - name: Prepare test and coverage reports
        id: reports
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p build
          echo "$PROJECT" > build/project.txt
          echo "artifact=reports-${PROJECT//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            ${{ matrix.project }}/build/project.txt
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/reports/jacoco/test/
          retention-days: 14

  build:
    name: Build and Test ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          PolarBookshop/quote-service,
          PolarBookshop/quote-function,
          PolarBookshop/dispatcher-service,
          PolarBookshop/config-service,
          PolarBookshop/order-service,
          PolarBookshop/edge-service,
        ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      # Artifact names can't contain "/". project.txt gives the summary the project's path,
      # and keeps the artifact from being empty when the build fails before the tests.
      - name: Prepare test and coverage reports
        id: reports
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p build
          echo "$PROJECT" > build/project.txt
          echo "artifact=reports-${PROJECT//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            ${{ matrix.project }}/build/project.txt
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/reports/jacoco/test/
          retention-days: 14

  reports:
    name: Test and coverage reports
    needs: [build-java-21, build]
    # Also after failed builds: the summary shows what failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports
      - name: Summarize reports
        run: python3 .github/scripts/report-summary.py reports >> "$GITHUB_STEP_SUMMARY"

  native-build:
    name: Native Build and Test ${{ matrix.project }}
    if: false   # disabled
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          Chapter16/16-end/quote-service,
          Chapter16/16-end/quote-function,
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, unit tests and integration tests
        run: |
          cd ${{ matrix.project }}
          chmod +x gradlew
          ./gradlew nativeBuild
