name: Commit Stage
on:
  push:
  schedule: # Every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:

# The smoke tests make a run long, and a newer push to the same branch makes an older run
# pointless. That's not so on the default branch, where each push needs its own result, or for
# scheduled and manual runs. Those each get a group of their own, since a group would also
# cancel a pending run when a newer one queues, even without cancel-in-progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
    && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  build-java-21:
    name: Build and Test ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          PolarBookshop/catalog-service,
        ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      # Artifact names can't contain "/". project.txt gives the summary the project's path,
      # and keeps the artifact from being empty when the build fails before the tests.
      - name: Prepare test and coverage reports
        id: reports
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p build
          echo "$PROJECT" > build/project.txt
          echo "artifact=reports-${PROJECT//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            ${{ matrix.project }}/build/project.txt
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/reports/jacoco/test/
          retention-days: 14

  build:
    name: Build and Test ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          PolarBookshop/quote-service,
          PolarBookshop/quote-function,
          PolarBookshop/dispatcher-service,
          PolarBookshop/config-service,
          PolarBookshop/order-service,
          PolarBookshop/edge-service,
        ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      # Artifact names can't contain "/". project.txt gives the summary the project's path,
      # and keeps the artifact from being empty when the build fails before the tests.
      - name: Prepare test and coverage reports
        id: reports
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p build
          echo "$PROJECT" > build/project.txt
          echo "artifact=reports-${PROJECT//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            ${{ matrix.project }}/build/project.txt
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/reports/jacoco/test/
          retention-days: 14

  k8s-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The Kubernetes release of MicroK8s 1.35/stable, which the smoke tests deploy to.
      KUBERNETES_VERSION: 1.35.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Renders the services' kustomizations with the kubectl of the runner image, and checks the
      # backing services the smoke tests deploy. The staging and production overlays in
      # polar-deployment/kubernetes/applications/ are left out: their base is the book's upstream
      # repository on GitHub, not this one.
      - name: Validate manifests
        shell: bash # runs with -o pipefail, so a kustomize error fails its pipeline
        run: |
          validate() { kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" "$@"; }
          status=0
          for dir in PolarBookshop/*/k8s; do
            echo "== $dir"
            kubectl kustomize "$dir" | validate - || status=1
          done
          dir=PolarBookshop/polar-deployment/kubernetes/platform/development/services
          echo "== $dir"
          validate "$dir" || status=1
          exit "$status"

  # Builds each service's image from this commit once, with the smoke test script, for all the
  # smoke test jobs. Runs beside the Gradle builds rather than after them: the image builds
  # compile the code themselves, and waiting would add the Gradle builds' time to every run. The
  # smoke test jobs still wait for the Gradle builds too.
  images:
    name: Build image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The script's name for each service, and its image.
        include:
          - { service: catalog, image: catalog-service }
          - { service: order, image: order-service }
          - { service: dispatcher, image: dispatcher-service }
          - { service: config, image: config-service }
          - { service: edge, image: edge-service }
          - { service: quote, image: quote-service }
          - { service: quote-function, image: quote-function }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          # A cache per service: each job needs its own project's dependencies only.
          cache-dependency-path: |
            PolarBookshop/${{ matrix.image }}/build.gradle
            PolarBookshop/${{ matrix.image }}/gradle/wrapper/gradle-wrapper.properties
      - name: Build the image
        env:
          SERVICE: ${{ matrix.service }}
          SMOKE_JDK_17: ${{ env.JAVA_HOME_17_X64 }}
          SMOKE_JDK_21: ${{ env.JAVA_HOME_21_X64 }}
        run: bash development/script/smoke-test.sh build "$SERVICE"
      - name: Save the image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p image
          podman save -q -o "image/$IMAGE.tar" "docker.io/library/$IMAGE:latest"
          ls -l image
      # Deleted by the delete-images job once the smoke tests are done.
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}
          path: image/${{ matrix.image }}.tar
          if-no-files-found: error
          retention-days: 1

  # Smoke tests the images from the images job together with their backing services, as on the
  # development server. Each selection runs on its own runner and gets its own row, output and
  # logs in the summary.
  smoke-podman:
    name: Smoke test on Podman (${{ matrix.services }})
    needs: [build-java-21, build, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The script's service selections. It adds catalog and order for edge, and catalog for
        # order.
        services:
          - catalog order dispatcher config
          - edge
          - quote quote-function
          - order dispatcher observability
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install podman-compose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman-compose python3-yaml
      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Load the images
        run: |
          for archive in images/*.tar; do podman load -q -i "$archive"; done
          rm -r images
          podman images
      - name: Show Podman and runner resources
        run: |
          podman version
          podman-compose version
          free -h
          df -h /
      # Without --rebuild, the script uses the loaded images. Without a JDK, it fails if one is
      # missing.
      - name: Smoke test
        shell: bash # runs with -o pipefail, so the script's status survives tee
        env:
          SERVICES: ${{ matrix.services }}
          SMOKE_JUNIT: ${{ github.workspace }}/smoke/test-results/test/TEST-smoke-podman.xml
        run: |
          read -ra services <<< "$SERVICES"
          mkdir -p smoke
          bash development/script/smoke-test.sh all "${services[@]}" 2>&1 | tee smoke/output.txt
      # These also run when the job times out, which cancels it: a hung stack needs the logs most.
      - name: Collect the containers' state and logs
        if: ${{ !success() }}
        run: bash development/script/smoke-test.sh logs smoke/logs
      - name: Show disk use
        if: ${{ always() }}
        run: |
          df -h /
          podman system df
      # The reports job summarizes reports-* artifacts; project.txt names the row.
      - name: Prepare smoke test reports
        id: reports
        if: ${{ always() }}
        env:
          SERVICES: ${{ matrix.services }}
        run: |
          mkdir -p smoke
          echo "Smoke test on Podman: $SERVICES" > smoke/project.txt
          echo "artifact=reports-smoke-podman-${SERVICES// /-}" >> "$GITHUB_OUTPUT"
      - name: Upload smoke test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: smoke/
          retention-days: 14

  # Deploys the services' own k8s/ manifests with the images from the images job to MicroK8s on
  # the runner, as the script's --k8s mode does on the development server. --k8s supports the
  # default selection only.
  smoke-k8s:
    name: Smoke test on MicroK8s
    needs: [build-java-21, build, k8s-manifests, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # MicroK8s' own kubectl, which matches the cluster's version, with its kubeconfig, set up
      # below. Through `sudo microk8s kubectl`, the script's Keycloak port-forward would run as
      # root, and the script couldn't stop it.
      KUBECTL: /snap/microk8s/current/kubectl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install PyYAML
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-yaml
      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Load the images
        run: |
          for archive in images/*.tar; do podman load -q -i "$archive"; done
          rm -r images
          podman images
      # MicroK8s keeps its own copies of the images, in its registry and in containerd, and its
      # kubelet evicts pods when less than 1 GiB of disk is free. Without the Paketo builders,
      # which the images job has, about 6 GB should stay free.
      - name: Install MicroK8s
        shell: bash # runs with -o pipefail, so a failing microk8s config fails the step
        run: |
          # The Snap Store sometimes doesn't answer.
          for attempt in 1 2 3; do
            sudo snap install microk8s --classic --channel=1.35/stable && break
            (( attempt < 3 )) || exit 1
            echo "::warning::snap install failed, retrying in 30 s"
            sleep 30
          done
          sudo microk8s status --wait-ready
          # Docker on the runner sets the FORWARD policy to DROP, which can block pod traffic;
          # microk8s inspect warns about it. This job doesn't use Docker.
          sudo iptables -P FORWARD ACCEPT
          sudo microk8s enable dns registry
          sudo microk8s config | install -m 600 /dev/stdin "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Wait for the cluster DNS and registry
        run: |
          "$KUBECTL" -n kube-system rollout status deployment/coredns --timeout=300s
          "$KUBECTL" -n container-registry rollout status deployment/registry --timeout=300s
          curl -sSf --retry 20 --retry-delay 3 --retry-connrefused http://localhost:32000/v2/
      - name: Show tool versions and runner resources
        run: |
          podman version
          "$KUBECTL" version
          free -h
          df -h /
      - name: Smoke test
        shell: bash # runs with -o pipefail, so the script's status survives tee
        env:
          SMOKE_JUNIT: ${{ github.workspace }}/smoke/test-results/test/TEST-smoke-k8s.xml
        run: |
          mkdir -p smoke
          bash development/script/smoke-test.sh all --k8s 2>&1 | tee smoke/output.txt
      - name: Collect the namespace's state and logs
        if: ${{ !success() }}
        run: bash development/script/smoke-test.sh logs smoke/logs --k8s
      - name: Show disk use
        if: ${{ always() }}
        run: |
          df -h /
          podman system df
          # containerd's images and the registry's storage
          sudo du -sh /var/snap/microk8s/common/var/lib/containerd \
            /var/snap/microk8s/common/default-storage || true
      - name: Prepare smoke test reports
        if: ${{ always() }}
        run: |
          mkdir -p smoke
          echo "Smoke test on MicroK8s" > smoke/project.txt
      - name: Upload smoke test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-smoke-k8s
          path: smoke/
          retention-days: 14

  # The images are for this run's smoke tests only. Deleting them right away keeps them from
  # counting against the account's artifact storage for a day. A failed smoke test job then can't
  # be re-run on its own; re-run all the jobs instead.
  delete-images:
    name: Delete the images
    needs: [images, smoke-podman, smoke-k8s]
    # Also when the run is cancelled, such as by a newer push.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write # deletes the run's artifacts
    steps:
      - name: Delete the image artifacts
        shell: bash # runs with -o pipefail, so a failed listing fails the step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("image-")) | "\(.id) \(.name)"' \
            | while read -r id name; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || exit 1
                echo "Deleted $name"
              done

  reports:
    name: Test and coverage reports
    needs: [build-java-21, build, smoke-podman, smoke-k8s]
    # Also after failed builds: the summary shows what failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # lists the run's artifacts for the links in the summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports
      # Without the list, the summary has no links.
      - name: List report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        # On an HTTP error gh writes the error response to the file too, so it's emptied then.
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("reports-")) | "\(.name)\t\(.id)"' \
            > artifacts.tsv \
            || { : > artifacts.tsv
                 echo "::warning::Could not list the artifacts, so the summary has no links."; }
      - name: Summarize reports
        run: python3 .github/scripts/report-summary.py reports artifacts.tsv >> "$GITHUB_STEP_SUMMARY"

  native-build:
    name: Native Build and Test ${{ matrix.project }}
    if: false   # disabled
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: [
          Chapter16/16-end/quote-service,
          Chapter16/16-end/quote-function,
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, unit tests and integration tests
        run: |
          cd ${{ matrix.project }}
          chmod +x gradlew
          ./gradlew nativeBuild
